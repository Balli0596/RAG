<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Agentic AI RAG Chatbot</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .container {
            width: 900px;
            max-width: 95%;
            margin: 40px auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            padding: 20px;
            background: #222;
            color: white;
        }

        .header h1 {
            margin: 0;
            font-size: 22px;
        }

        .header p {
            margin: 5px 0 0;
            font-size: 14px;
            opacity: 0.8;
        }

        .chat-box {
            height: 550px;
            overflow-y: auto;
            padding: 20px;
        }

        .message {
            margin-bottom: 20px;
        }

        .user {
            text-align: right;
        }

        .user .bubble {
            background: #222;
            color: white;
        }

        .bot .bubble {
            background: #eeeeee;
            color: #222;
        }

        .bubble {
            display: inline-block;
            padding: 12px 16px;
            border-radius: 12px;
            max-width: 75%;
            line-height: 1.5;
            text-align: left;
        }

        .context {
            margin-top: 10px;
            padding: 12px;
            background: #fafafa;
            border-left: 3px solid #555;
            font-size: 13px;
        }

        .context-header {
            font-weight: bold;
            margin-bottom: 8px;
        }

        .input-area {
            display: flex;
            padding: 15px;
            border-top: 1px solid #ddd;
            gap: 10px;
        }

        #question {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: #222;
            color: white;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .source-link {
            display: block;
            margin-top: 8px;
            padding: 10px 12px;

            background: white;

            border: 1px solid #ddd;

            border-radius: 8px;

            color: #222;

            text-decoration: none;

            font-size: 14px;
        }

        .source-link:hover {
            background: #f0f0f0;
            text-decoration: underline;
        }
        .score {
            margin-top: 8px;
            font-size: 12px;
            color: #666;
        }

    </style>

</head>


<body>

<div class="container">

    <div class="header">

        <h1>Agentic AI RAG Chatbot</h1>

        <p>
            Ask questions about the Agentic AI ebook
        </p>

    </div>


    <div id="chatBox" class="chat-box">

        <div class="message bot">

            <div class="bubble">

                Hello! Ask me anything about the
                Agentic AI ebook.

            </div>

        </div>

    </div>


    <div class="input-area">

        <input
            type="text"
            id="question"
            placeholder="Ask a question..."
            onkeydown="handleKey(event)"
        >

        <button
            id="sendButton"
            onclick="sendMessage()"
        >
            Send
        </button>

    </div>

</div>


<script>
async function sendMessage() {

    const input =
        document.getElementById("question");

    const question =
        input.value.trim();

    if (!question) {
        return;
    }

    addMessage(
        question,
        "user"
    );

    input.value = "";

    const button =
        document.getElementById("sendButton");

    button.disabled = true;
    button.innerText = "Thinking...";


    try {

        const response = await fetch(
            "http://127.0.0.1:8000/chat/stream",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    question: question
                })
            }
        );


        if (!response.ok) {

            throw new Error(
                "API request failed"
            );

        }


        // -------------------------
        // Create bot message
        // -------------------------

        const chatBox =
            document.getElementById("chatBox");

        const message =
            document.createElement("div");

        message.className =
            "message bot";


        const bubble =
            document.createElement("div");

        bubble.className =
            "bubble";

        bubble.innerText = "";

        message.appendChild(bubble);

        chatBox.appendChild(message);


        // -------------------------
        // Read stream
        // -------------------------

        const reader =
            response.body.getReader();

        const decoder =
            new TextDecoder();


        let buffer = "";

        let confidence = null;

        let retrievedContext = [];


        while (true) {

            const {
                value,
                done
            } = await reader.read();


            if (done) {
                break;
            }


            buffer += decoder.decode(
                value,
                { stream: true }
            );


            const events =
                buffer.split("\n\n");


            buffer =
                events.pop();


            for (const event of events) {

                if (!event.startsWith("data:")) {
                    continue;
                }


                const data =
                    event
                        .replace("data:", "")
                        .trim();


                if (data === "[DONE]") {
                    continue;
                }


                const parsed =
                    JSON.parse(data);


                // -------------------------
                // Token
                // -------------------------

                if (
                    parsed.type === "token"
                ) {

                    bubble.innerText +=
                        parsed.content;

                    chatBox.scrollTop =
                        chatBox.scrollHeight;
                }


                // -------------------------
                // Metadata
                // -------------------------

                if (
                    parsed.type === "metadata"
                ) {

                    confidence =
                        parsed.confidence;

                    retrievedContext =
                        parsed.context;

                }

            }

        }


        // -------------------------
        // Add score
        // -------------------------

        if (confidence !== null) {

            const score =
                document.createElement("div");

            score.className = "score";

            score.innerText =
                "Retrieval score: " +
                Number(confidence)
                    .toFixed(4);

            message.appendChild(score);

        }


        // -------------------------
        // Add context
        // -------------------------

        addContext(
            message,
            retrievedContext
        );


    } catch (error) {

        addMessage(
            "Something went wrong: " +
            error.message,
            "bot"
        );

    }


    button.disabled = false;
    button.innerText = "Send";
}
function addContext(message, context) {

    const container =
        document.createElement("div");

    container.className = "context";


    const header =
        document.createElement("div");

    header.className =
        "context-header";

    header.innerText = "Sources";

    container.appendChild(header);


    context.forEach((item, index) => {

        const source =
            document.createElement("a");

        source.href =
            "http://127.0.0.1:8000"
            + item.source;

        source.target = "_blank";

        source.className =
            "source-link";

        source.innerText =
            `📄 Page ${item.page}`;


        container.appendChild(source);

    });


    message.appendChild(container);
}
function addMessage(
    text,
    type
) {

    const chatBox =
        document.getElementById("chatBox");


    const message =
        document.createElement("div");

    message.className =
        "message " + type;


    const bubble =
        document.createElement("div");

    bubble.className =
        "bubble";

    bubble.innerText = text;


    message.appendChild(bubble);

    chatBox.appendChild(message);


    chatBox.scrollTop =
        chatBox.scrollHeight;
}


function addBotResponse(data) {

    const chatBox =
        document.getElementById("chatBox");


    const message =
        document.createElement("div");

    message.className =
        "message bot";


    const bubble =
        document.createElement("div");

    bubble.className =
        "bubble";

    bubble.innerText =
        data.answer;


    message.appendChild(bubble);


    const score =
        document.createElement("div");

    score.className =
        "score";

    score.innerText =
        "Retrieval score: "
        + Number(data.confidence)
            .toFixed(4);


    message.appendChild(score);


    const context =
        document.createElement("div");

    context.className =
        "context";


    const header =
        document.createElement("div");

    header.className =
        "context-header";

    header.innerText =
        "Retrieved Context";


    context.appendChild(header);


    data.retrieved_context
        .forEach((item, index) => {

            const chunk =
                document.createElement("div");

            chunk.style.marginBottom =
                "12px";

            chunk.innerHTML = `
                <strong>
                    Chunk ${index + 1}
                </strong><br>
                Page: ${item.page}<br>
                Score: ${Number(item.score).toFixed(4)}
                <br><br>
                ${escapeHtml(
                    item.text.substring(0, 500)
                )}
            `;

            context.appendChild(chunk);

        });


    message.appendChild(context);

    chatBox.appendChild(message);


    chatBox.scrollTop =
        chatBox.scrollHeight;
}


function escapeHtml(text) {

    const div =
        document.createElement("div");

    div.innerText = text;

    return div.innerHTML;
}


function handleKey(event) {

    if (event.key === "Enter") {

        sendMessage();

    }

}

</script>

</body>

</html>
